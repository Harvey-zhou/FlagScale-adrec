# DCN-Mix paper protocol -- Wang et al., WWW 2021 (arXiv:2008.13535) -- Criteo_x1.
#
# Table 6 best setting for DCN-Mix on Criteo: LogLoss 0.4408 / AUC 0.8112.
# The paper's split (first 6 days train, last day split into valid/test) is not
# distributed; this uses the reczoo criteo_x1 7:2:1 split, so the paper's number
# is context, not a target (the BARS reference on this split is AUC 0.8142 /
# logloss 0.4378 for full-rank DCN-V2, mixture off).
#
# Tags: [paper] stated in the paper and must not change for a paper run
#       [ours]  not stated for this configuration; a free choice
name: dcn_mix_paper
seed: 2021                      # [ours]
batch_size: 512                 # [paper 7.1.3] "batch size of 512"
eval_batch_size: 65536          # [ours] evaluation only
epochs: 3                       # [paper 7.1.3] best training run 150k steps ~ 2.3 epochs here
early_stop_patience: 0          # [ours] the paper trains a fixed number of steps
monitor: AUC                    # [paper Table 6] AUC / logloss
log_every: 1000                # per-step progress (batch 512 x 64k steps is slow enough to need it)
output_dir: ${experiment.exp_dir}/checkpoint
ema_decay: 0.9999               # [paper 7.1.3] "exponential moving average with decay 0.9999"

model:
  model_type: dcn_mix
  torch_dtype: fp32             # [ours]
  embedding_dim: 39             # [paper 7.1.3] "39 for Criteo"
  num_cross_layers: 3           # [paper Table 6] ll=3
  num_experts: 4                # [paper Table 6] K=4
  low_rank: 64                  # [paper Table 6] r=258 total over 4 experts (~64.5 each)
  cross_activation: hard_tanh   # [paper Table 6] hard_tanh for DCN-Mix on Criteo
  cross_gate: constant          # [paper Table 6] "gate as constant"
  cross_init: he                # [paper 7.1.3] He Normal kernels
  parallel_dnn_hidden_units: [512, 512]  # [paper Table 6] DNN setting (2, 512)
  dnn_activations: relu         # [paper 3.3] "we set it to be ReLU"
  net_dropout: 0.0              # [ours] the paper mentions no dropout
  batch_norm: false             # [ours]

data:
  path: ${oc.env:FLAGOS_ADS_DATA,/flagos-ads/datasets}/criteo_x1
  valid_split: valid
  group_key: null
  num_workers: 2
  max_samples: null
  eval_max_samples: null

optimizer:
  name: adam                    # [paper 7.1.3]
  lr: 5.0e-4                    # [ours] paper's narrowed range is 1e-4 .. 5e-4
  weight_decay: 0.0             # [ours]
  embedding_regularizer: 1.0e-5 # [ours] paper searches lambda in {0, 3e-5, 1e-4}
  max_gradient_norm: 10.0       # [paper 7.1.3] "gradient clipping norm was 10"

scheduler:
  type: none                    # [ours] fixed learning rate
  warmup_steps: 0
