# DIN on MovieLens-20M.
#
# The DIN paper (KDD'18) has no MovieLens experiment -- its datasets are Amazon
# and Alibaba -- so this is a **project benchmark, not a paper reproduction**:
# the model and training recipe are the BARS/FuxiCTR `din.yaml` configuration,
# and the dataset follows the authors' Amazon protocol applied to ML-20M
# (see examples/ads/prepare_movielens20m_din.py).
#
# Expect a different scale from the Amazon run: 39.5 M training rows instead of
# 2.6 M, so the batch-1024 recipe is used for a feasible wall clock (~1.3 h per
# epoch on one P800) rather than the paper's batch 32.
name: din_ml20m
seed: 20222023
batch_size: 1024
eval_batch_size: 8192
epochs: 9                       # [ours] about 12 h on one card
early_stop_patience: 0          # [ours] fixed budget: the test split doubles as validation
monitor: gAUC
log_every: 0
output_dir: ${experiment.exp_dir}/checkpoint

model:
  model_type: din
  torch_dtype: fp32
  embedding_dim: 64
  attention_hidden_units: [512, 256]
  attention_hidden_activations: dice
  attention_dropout: 0.1
  din_use_softmax: true
  dnn_hidden_units: [1024, 512, 256]
  dnn_activations: dice
  net_dropout: 0.1
  batch_norm: true

data:
  path: ${oc.env:FLAGOS_ADS_DATA,/flagos-ads/datasets}/movielens_20m_din
  valid_split: test             # no validation split exists; the test split is monitored
  group_key: user_id
  num_workers: 2
  max_samples: null
  eval_max_samples: null

optimizer:
  lr: 5.0e-4
  embedding_regularizer: 5.0e-3
  max_gradient_norm: 10.0
